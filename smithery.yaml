# Smithery configuration for Correios: Rastreamento
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_correios_rastreamento

name: correios_rastreamento-mcp
displayName: "Correios: Rastreamento"
description: >
  Correios: Rastreamento, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/correios_rastreamento-mcp
repository: https://github.com/mcp-dir/correios_rastreamento-mcp

tags:
  - correios_rastreamento
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_correios_rastreamento

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_correios_rastreamento/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
